[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grib-assembler"
version = "1.0.0"
description = "Offline GRIB2 collection assembler (header read + byte-copy only)"
requires-python = ">=3.11"
dependencies = [
    "eccodes",
    "numpy",
    "zarr<3",
    "numcodecs",
]

[project.scripts]
grib-asm = "grib_asm.cli:main"
grib-cube = "grib_asm.cube.cli:main"
grib-cube-training = "grib_asm.training.cli:main"
[tool.setuptools]
packages = ["grib_asm", "grib_asm.cube", "grib_asm.training"]

[tool.pytest.ini_options]
markers = [
    "slow: large/temporary-archive tests that are slow or resource heavy",
]
